    - data:
        type: code
        title: 判定・結果行の作成
        desc: ''
        code_language: python3
        code: |
          import json
          import re
          try:
              import unicodedata
          except Exception:  # サンドボックスで利用できない場合は全角英数記号のみ半角化する
              class unicodedata:
                  @staticmethod
                  def normalize(form, s):
                      return "".join(chr(ord(c) - 0xFEE0) if 0xFF01 <= ord(c) <= 0xFF5E else (" " if c == "\u3000" else c) for c in s)

          # ============================================================
          # 判定・結果行の作成(試験自動実行ワークフロー用コードノード)
          #   LLM 判定(想定結果との比較)と、キーワード判定(想定結果の「」内の値・期待キーワード)を併記する
          # ============================================================


          def nf(s):
              return re.sub(r"\s+", "", unicodedata.normalize("NFKC", s or "")).replace("〜", "~").replace("～", "~").lower()


          def main(no: str, name: str, q: str, expect_text: str, expect_kw: str, answer: str, judge: str, route: str) -> dict:
              ans = answer or ""
              j = re.sub(r"<think>.*?</think>", "", judge or "", flags=re.S)
              m = re.search(r"判定\s*[:：]\s*(OK|NG|要確認)", j)
              verdict = m.group(1) if m else "要確認"
              r = re.search(r"理由\s*[:：]\s*(.+)", j)
              reason = r.group(1).strip()[:200] if r else j.strip()[:200]

              kws = [k.strip() for k in (expect_kw or "").split("|") if k.strip()]
              mode = "any"
              if not kws:
                  kws = [k for k in re.findall(r"「([^」]{1,40})」", expect_text or "")]
                  mode = "all"
              kw_result = "-"
              if kws:
                  hits = [k for k in kws if nf(k) in nf(ans)]
                  ok = (len(hits) == len(kws)) if mode == "all" else bool(hits)
                  kw_result = ("一致" if ok else "不一致") + "(%s)" % "・".join(kws)[:120]
              has_ref = "あり" if re.search(r"参照\s*[:：]", ans) else "なし"
              row = {"通番": no, "項番・試験名": name, "試験メッセージ": q, "想定結果": expect_text or expect_kw,
                     "回答": ans[:2500], "LLM判定": verdict, "判定理由": reason, "キーワード判定": kw_result,
                     "参照の有無": has_ref, "回答経路": "固定応答" if route == "fixed" else "ナレッジ検索+LLM"}
              return {"result": json.dumps(row, ensure_ascii=False)}
