    - data:
        type: code
        title: 前処理・入力判定
        desc: 型番の実在確認・質問の分割・用途外/記載なし/日本語の誤りの判定を決定的に行う
        code_language: python3
        code: |
          import json
          import re
          try:
              import unicodedata
          except Exception:  # サンドボックスで利用できない場合は全角英数記号のみ半角化する
              class unicodedata:
                  @staticmethod
                  def normalize(form, s):
                      return "".join(chr(ord(c) - 0xFEE0) if 0xFF01 <= ord(c) <= 0xFF5E else (" " if c == "\u3000" else c) for c in s)

          # ============================================================
          # 前処理・入力判定(Dify コードノード)
          #   入力 : query(利用者の入力) / pending(前回の聞き返し内容) / last_model(直前の話題の型番)
          #   出力 : route = "fixed"(固定文で回答) | "rag"(ナレッジ検索して回答)
          #          fixed_answer / plan_json / q1〜q4(検索クエリ) / new_pending / new_last_model
          # 型番判定・登録資料にない情報・用途外・日本語の誤りなどは LLM に任せず、ここで決定的に判定する
          # ============================================================

          NOT_FOUND = "登録資料に記載が見つかりませんでした。原本のマニュアルを確認してください。"

          # ---- 登録資料に記載のある型番(ナレッジ 01/02/03 の資料名・本文から抽出) ----
          APRESIA = [
              "XGMC-2016", "XGMC-2001L", "XGMC-2001LDW", "XGMC-2001LSS", "XGMC-2101X", "XGMC-2101X-PSR",
              "XGMC-2101LDW", "XGMC-2101LDW-PSR", "GMC-2001", "GMC-2101", "GMC-2101-PSR", "GMC-2201",
              "CGMC-2101LDW", "CGML-2001VLT", "CGML-2001VLT-P", "CGML-2101LDW", "XGML-2001L", "XGML-2001LDW",
              "XGML-2001VLT", "XGML-2001VLT2", "XGML-2001X", "XGML-2101X", "XGML-2101LDW", "XGML-2101LX",
              "X2L-G2001", "X2L-G2201", "XGAL-2002PB", "XGAL-2102PB", "XGMU-SNMP",
              "OPL-3002CW", "OPL-3008DW", "OPL-3016DW", "OPL-3104DW", "OPL-3108DW", "OPL-4008DW", "OPL-5008DW",
              "OPX-3016DW", "OPX-4140DW", "PSU-850-AC", "PSU-850-DC48V",
          ]
          NEC = [
              "GM3200", "ME3200", "GM100", "ME100", "GM100X-R", "GM100TR-R", "GM100T-R", "GM100X-R201",
              "GM100T-R201", "GM100X", "GM100TR", "GM100T", "ME100R", "ME100-R", "ME100R1", "ME100-R1", "ME100R-201",
          ]
          MODULES = [
              "H-LX40-SFP", "H-LX80-SFP", "H-SX-SFP", "H-LX-SFP", "H-SX-SFP-A", "H-T-SFP", "BX80-SFP",
