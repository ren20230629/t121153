          def nfkc(s):
              s = unicodedata.normalize("NFKC", s or "")
              s = re.sub(r"(?<=[A-Za-z0-9])[‐‑‒–—―−ー](?=[A-Za-z0-9])", "-", s)
              s = re.sub(r"\b(XGMC|CGMC|XGML|CGML|GMC|OPL|OPX)\s?(\d{4})", r"\1-\2", s, flags=re.I)
              s = re.sub(r"\b(GM|ME)-(\d{3,4})\b", r"\1\2", s, flags=re.I)
              return s.strip()


          def dl(a, b):
              # Damerau-Levenshtein 距離(型番の誤り判定用)
              a, b = a.upper(), b.upper()
              d = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
              for i in range(len(a) + 1):
                  d[i][0] = i
              for j in range(len(b) + 1):
                  d[0][j] = j
              for i in range(1, len(a) + 1):
                  for j in range(1, len(b) + 1):
                      c = 0 if a[i - 1] == b[j - 1] else 1
                      d[i][j] = min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c)
                      if i > 1 and j > 1 and a[i - 1] == b[j - 2] and a[i - 2] == b[j - 1]:
                          d[i][j] = min(d[i][j], d[i - 2][j - 2] + 1)
              return d[len(a)][len(b)]


          TOKEN_RE = re.compile(r"(?<![A-Za-z0-9_\-/+.])([A-Za-z0-9][A-Za-z0-9_\-/+]*[A-Za-z0-9+])")
          DEVICE_LIKE = re.compile(r"^[A-Z]{1,5}-?\d{3,4}[A-Z0-9]*(?:[-/][A-Z0-9]+)*$")
          MODULE_LIKE = re.compile(r"^[A-Z0-9][A-Z0-9_\-/]*-?(?:SFP\+?|SPF\+?|FSP\+?|XFP|XPF|FXP|QSFP28|CFP4|CFP2)(?:[-/+][A-Z0-9\-/+]+)?$")
          IGNORE = re.compile(r"^(TD\d|SP\d|IEEE|RJ-?45|ITU|VER|V\d|CAT|FTL|FCL|FIM)", re.I)


          def is_known(tok):
              u = tok.upper()
              if u in KNOWN:
                  return KNOWN[u]
              # 既知の型番 + "-"/"/" 区切りの派生(例: XGMC-2101X-PSR、GM3200-CTRL1、H-LX40-SFP/R)
              for k in sorted(KNOWN, key=len, reverse=True):
                  if u.startswith(k) and len(u) > len(k) and u[len(k)] in "-/+":
                      return KNOWN[k] if k not in ("GM100", "ME100") else tok
              # GM100 系の派生型番(GM100X-R/L 等)
              if re.match(r"^GM100(X|T|TR|T_X)?(-R)?(\d{3})?(/[A-Z]+)?(-201)?$", u) or re.match(r"^ME100(R|-R)?\d?(-\d{3})?(/[A-Z]+)?(-201)?$", u):
                  return tok
              return None


          def extract_models(text):
              found = []
              for m in TOKEN_RE.finditer(text):
                  tok = m.group(1).rstrip("/-")
                  u = tok.upper()
                  if IGNORE.match(u):
                      continue
                  if not (tok[0].isupper() or tok[0].isdigit()):
                      continue
                  known = is_known(tok)
                  kind = "module" if (MODULE_LIKE.match(u) or u in MODULE_SET) else ("device" if DEVICE_LIKE.match(u) else None)
                  if known:
                      found.append({"tok": tok, "model": known, "valid": True, "pos": m.start(), "kind": kind or "device"})
                  elif kind:
                      found.append({"tok": tok, "model": tok, "valid": False, "pos": m.start(), "kind": kind})
              return found


          def suggest(tok, kind):
              pool = MODULES if kind == "module" else APRESIA + ["GM3200", "ME3200", "GM100", "ME100"]
              scored = sorted(((dl(tok, c), c) for c in pool), key=lambda x: (x[0], len(x[1])))
              # 1文字違い(置換・脱字・余分・隣接入替え)のみを候補にする。離れた型番(GM5000→GM3200 等)は候補にしない
              out = [c for d, c in scored if d <= 1][:3]
              if not out and kind != "module":
                  for dg in re.findall(r"\d{3,4}", tok):
                      out += [c for c in DIGIT_INDEX.get(dg, []) if c not in out]
              return out[:3]


          def invalid_message(tok, kind):
              cands = suggest(tok, kind)
              msg = NOT_FOUND + "(「%s」という型番は登録資料にありません。型番の誤りの可能性があります。" % tok
              if cands:
                  msg += "もしかして「%s」のことでしょうか? 正しい型番をご確認のうえ、改めて質問してください)" % "」または「".join(cands)
              else:
                  msg += "正しい型番をご確認のうえ、改めて質問してください)"
              return msg


          def has_particles(tok):
              return re.search(r"(の|を|は|が|に|で|と|へ|から|まで|について|って|ですか|ますか|ください)", tok) is not None


          def japanese_issue(text, models):
              """日本語の誤り(誤変換・脱字・てにをは・単語の羅列)を検出。(説明, 推定した正しい質問) を返す"""
              for wrong, right in TYPO.items():
                  if wrong in text:
                      return ("「%s」は「%s」の誤記ではないでしょうか。" % (wrong, right), text.replace(wrong, right))
              for kw in re.findall(r"[ァ-ヴー]{2,}", text):
                  if kw in KATAKANA_OK or len(kw) < 2:
                      continue
                  for term in KATAKANA_TERMS:
                      if kw != term and abs(len(kw) - len(term)) <= 1 and dl(kw, term) == 1 and len(term) >= 3:
                          return ("「%s」は「%s」の誤記ではないでしょうか。" % (kw, term), text.replace(kw, term))
              if re.search(r"が(教えて|知りたい|おしえて)", text):
                  fixed = re.sub(r"に(?=[^に]*が(教えて|知りたい|おしえて))", "の", text, count=1)
                  fixed = re.sub(r"が(教えて|知りたい|おしえて)", r"を\1", fixed)
                  return ("助詞(てにをは)に誤りがあるようです。", fixed)
              toks = [t for t in re.split(r"[\s　]+", text) if t]
              model_toks = {m["tok"] for m in models}
              words = [t for t in toks if t not in model_toks]
              if len(toks) >= 3 and len(words) >= 2 and not any(has_particles(t) for t in words):
                  head = "・".join(m["model"] for m in models) if models else ""
                  guess = (head + "について、" if head else "") + "「" + "」「".join(words) + "」に関する何を知りたいか"
                  return ("単語の羅列のため、ご質問の意図を特定できませんでした。", guess)
              return None


          def aspects_for(text):
              extra = []
              for pat, kw in ASPECTS:
                  if re.search(pat, text, flags=re.I):
                      extra.append(kw)
              return extra


          def english_to_japanese(text):
              if re.search(r"[ぁ-んァ-ヶ一-龥]", text):
                  return text
              t = text
              rep = [
                  (r"power consumption", "消費電力"), (r"apparent power", "皮相電力"), (r"weight|mass", "質量"),
                  (r"wavelength", "送信波長"), (r"transmit(ting)? power|output power", "光送信レベル"),
                  (r"commands?", "コマンド"), (r"logs?", "ログ"), (r"status|state", "状態"),
              ]
              found = [ja for pat, ja in rep if re.search(pat, t, flags=re.I)]
              models = [m["model"] for m in extract_models(t)]
              if found and models:
                  return "%sの%sを教えてください" % ("と".join(models), "と".join(found))
              return text


          STYLE_ONLY = r"^(簡潔に|短く|詳しく|詳細に|要点を|箇条書きで|表で|表形式で|日本語で|わかりやすく|まとめて|一覧で)"
          NO_SPLIT = r"違い|比較|差分|同じ|異な|どう違|どちら|共通|ですよね|ますよね|よね\?|でも使え|書いてあ|記載されて"


          def has_aspect(seg, ms):
              rest = seg
              for m in ms:
                  rest = rest.replace(m["tok"], "")
              rest = re.sub(r"(それぞれ|各々|まとめて|ずつ|について|に関して)", "", rest)
              return len(re.sub(r"[\s、。,?!のとをはでにがや]", "", rest)) >= 2


          def split_parts(text):
              """1つの入力に含まれる複数の質問を分割する。戻り値: (質問文のリスト, 回答スタイルの指示)"""
              style = []
              sents = []
              for s in re.split(r"(?<=[?])|。|\n", text):
                  s = (s or "").strip()
                  if not s:
                      continue
                  if re.search(STYLE_ONLY, s) and not extract_models(s) and len(s) <= 30:
                      style.append(s)
                  else:
                      sents.append(s)
              parts = []
              for s in sents:
                  if re.search(NO_SPLIT, s):
                      parts.append(s)
                      continue
                  segs = [s]
                  if re.search(r"それぞれ|まとめて|各々|ずつ", s) or len(extract_models(s)) >= 2 or "と、" in s:
                      segs = [x for x in re.split(r"と、|、|,(?=\S)", s) if x.strip()]
                      # 観点のない区切り(「XGMC-2016とGM3200、それぞれの〜」の前半)は次の区切りと結合する
                      merged = []
                      for x in segs:
                          if merged and not has_aspect(merged[-1], extract_models(merged[-1])):
                              merged[-1] = merged[-1] + "、" + x
                          else:
                              merged.append(x)
                      segs = merged
                  for seg in segs:
                      ms = extract_models(seg)
                      if len(ms) >= 2:
                          # 「AとBのX」「AのXとBのY」 → 型番の位置で分割
                          cuts = [m["pos"] for m in ms[1:]]
                          pieces, prev = [], 0
                          for c in cuts:
                              pieces.append(seg[prev:c])
                              prev = c
                          pieces.append(seg[prev:])
                          parts += pieces
                      else:
                          parts.append(seg)
              cleaned = []
              for p in parts:
                  p = re.sub(r"^(と|、|,|および|及び|や|それと|また)\s*", "", p.strip())
                  p = re.sub(r"(と|、|,|および|及び|や)$", "", p).strip()
                  p = re.sub(r"を?まとめて(?=教えて|ください|下さい)", "を", p)
                  if p:
                      cleaned.append(p)
              # 片側だけに観点がある場合(「XGMC-2016と / GM3200のログ確認方法」)は観点を共有する
              result = []
              tail = None
              for p in reversed(cleaned):
                  ms = extract_models(p)
                  rest = p
                  for m in ms:
                      rest = rest.replace(m["tok"], "")
                  rest = rest.strip()
                  lead = re.match(r"^[、,\s]*(の|で|は|に|が)?", rest).group(1) or "の"
                  rest = re.sub(r"^[、,\s]*(の|で|は|に|が)?[、,\s]*(それぞれ|各々)?の?", "", rest).strip()
                  if has_aspect(p, ms):
                      tail = (lead, rest)
                  elif ms and tail:
                      p = ms[0]["tok"] + tail[0] + tail[1]
                  result.append(p)
              result.reverse()
              # 型番のない質問は直前の質問の型番を引き継ぐ(機器仕様一覧など資料そのものを指定した質問は除く)
              final, last = [], []
              for p in result:
                  ms = extract_models(p)
                  if ms:
                      last = ms
                  elif last and not re.search(r"機器仕様一覧|登録されている", p) and not re.search(r"SEND|XGMC|GMC", p):
                      p = last[0]["tok"] + "の" + p
                  p = re.sub(r"(は|を|の)?(それぞれ|各々)(の)?", lambda m: m.group(1) or m.group(3) or "", p)
                  p = re.sub(r"[、,\s]+(の|は|で)", r"\1", p)
                  if p not in final:
                      final.append(p)
              return (final or [text]), " ".join(style)


          def classify_part(p):
              ms = extract_models(p)
              bad = [m for m in ms if not m["valid"]]
              good = [m for m in ms if m["valid"]]
              if bad and not good:
                  return {"type": "fixed", "text": p, "answer": " ".join(invalid_message(m["tok"], m["kind"]) for m in bad)}
              if re.search(r"価格|値段|金額|費用|料金|保守費|いくら|納期|在庫|製造中止|生産中止|販売終了|販売中止|EOL|発売|後継|price|cost", p, re.I):
                  return {"type": "fixed", "text": p, "answer": NOT_FOUND + "(価格・費用・納期・在庫・製造中止・後継機種などの販売情報は登録資料に含まれていません)"}
              if re.search(r"Cisco|IOS|Catalyst|Juniper|クラウド", p, re.I):
                  return {"type": "fixed", "text": p, "answer": NOT_FOUND + "(他社製品のコマンド・クラウド管理機能など、登録資料の範囲外の内容です)"}
              if re.search(r"分解|廃棄|処分|清掃", p):
                  return {"type": "fixed", "text": p, "answer": NOT_FOUND + "(分解・清掃・廃棄などの手順は登録資料に記載がないため、一般的な手順を創作して回答することはできません)"}
              note = " ".join(invalid_message(m["tok"], m["kind"]) for m in bad)
              llm_text = ""
              if re.search(r"推奨値|推奨の値|推奨設定|おすすめの値", p):
                  note += "推奨値は登録資料に記載が見つかりませんでした。以下は資料に記載されている設定方法・初期値です。"
                  # LLM には「推奨値」ではなく初期値・設定方法を聞く(推奨値を探して「記載なし」と答えるのを防ぐ)
                  llm_text = re.sub(r"推奨値|推奨の値|推奨設定|おすすめの値", "初期設定(初期値)と設定方法", p)
              premise = bool(re.search(r"ですよね|ますよね|ですね\?|でしょ\?|よね\?", p))
              asp = " ".join(aspects_for(p))
              names = list(dict.fromkeys(m["model"] for m in good))
              if not names and re.search(r"\blinecard\b", p):
                  asp += " XGMC-2016 CommandReference_XGMC-2016"  # linecard 指定の構文は集合型 XGMC-2016 のコマンド
              hint, tail = "", ""
              if premise and re.search(r"\blinecard\b", p, re.I) and names and "XGMC-2016" not in names:
                  hint = ("linecard を付けた構文(configure linecard … / system-download linecard …)は集合型 XGMC-2016 の管理モジュールから"
                          "ラインカード・リモートユニットを操作するためのコマンドです。%s 単体のコマンドとは異なることを指摘してください。" % "・".join(names))
                  tail = ("(補足: linecard を付けた構文は集合型 XGMC-2016 の管理モジュールからラインカード・リモートユニットを操作するためのコマンドで、"
                          "%s 単体の構文とは異なります。参照: ReleaseNotes_XGMC-2016-Ver.1.05.49_TD61-8607.pdf p.4)" % "・".join(names))
              if re.search(r"すべて|全て|全部|一覧|列挙", p) and re.search(r"コマンド|command", p, re.I):
                  tail = ("※上記は検索で確認できた主なコマンドのみで、網羅したものではありません。"
                          "すべてのコマンドはCommandReferenceのコマンド一覧章参照(各装置のコマンドリファレンスの目次・コマンド一覧)。")
              # バージョン指定: 資料名の表記(Ver.1.05.36)に合わせた検索語を加え、複数バージョンは版ごとに検索する
              vers = list(dict.fromkeys(re.findall(r"(?:Ver\.?\s?|v)?(\d+\.\d{2}\.\d{2})", p, re.I)))
              version_q = bool(vers) or bool(re.search(r"バージョン|リリース|追加された|削除|廃止", p))
              if vers:
                  asp += " " + " ".join("Ver.%s %s" % (v, v) for v in vers) + " 機能追加 仕様変更 ReleaseNotes"
              if len(names) >= 2 and all(n.upper() in MODULE_SET or MODULE_LIKE.match(n.upper()) for n in names) and "伝送特性" not in asp:
                  # 光モジュール同士の比較で観点の指定が無い質問(「AとBの違い」): 各モジュールの仕様書(伝送特性の表)が検索されるよう、
                  # 仕様書の見出し語を検索語に加える(送信波長などの観点がある質問は、すでに同じ語が検索語に入っている)
                  asp += " 標準仕様書 伝送特性 送信波長 光送信レベル 光受信レベル"
              if len(names) >= 2:
                  # 比較・前提確認の質問: 型番ごとに検索する
                  queries = [re.sub(r"\s+", " ", "%s %s %s" % (n, p, asp)).strip()[:250] for n in names]
              elif len(vers) >= 2:
                  queries = [re.sub(r"\s+", " ", "%s ReleaseNotes Ver.%s %s 機能追加 仕様変更 不具合修正 %s" % (" ".join(names), v, v, p)).strip()[:250]
                             for v in vers]
              else:
                  queries = [re.sub(r"\s+", " ", "%s %s %s" % (p, " ".join(names), asp)).strip()[:250]]
              return {"type": "rag", "text": p, "queries": queries, "models": names, "note": note.strip(), "premise": premise,
                      "hint": hint, "tail": tail, "version": version_q, "llm_text": llm_text}


          def main(query: str, pending: str, last_model: str) -> dict:
              raw = query or ""
              text = nfkc(raw)
              pending = (pending or "").strip()
              last_model = (last_model or "").strip()
              prefix = ""

              def out_fixed(ans, new_pending="", new_last=None):
                  return {"route": "fixed", "fixed_answer": ans, "plan_json": "[]", "q1": text or "-", "q2": text or "-",
                          "q3": text or "-", "q4": text or "-", "new_pending": new_pending,
                          "new_last_model": last_model if new_last is None else new_last, "normalized": text}

              # ---- 1. 前回の聞き返しへの返答(足りない情報のみの入力) ----
              models_now = extract_models(text)
              if pending:
                  only_models = models_now and len(re.sub(r"[\s、,。?]", "", re.sub("|".join(re.escape(m["tok"]) for m in models_now), "", text))) <= 3
                  if re.fullmatch(r"(はい|そう|そうです|お願いします|それで|yes|ok|OK)[。!]*", text):
                      text = pending
                      if last_model and not extract_models(text):
                          # 「この機器の〜」への「はい」 → 直前の話題の型番で質問する
                          text = re.sub(r"この(機器|装置|製品|モジュール)|その(機器|装置|製品|モジュール)", last_model, text)
                          text = re.sub(r"^(では|じゃあ|それでは)、?", last_model + "の", text)
                  elif only_models and all(m["valid"] for m in models_now):
                      mdl = models_now[0]["tok"]
                      if re.search(r"この(機器|装置)|その(機器|装置)", pending):
                          text = re.sub(r"この(機器|装置)|その(機器|装置)", mdl, pending)
                      else:
                          digits = re.findall(r"(?<![A-Za-z0-9\-])\d{3,4}(?![0-9])", pending)
                          if digits and digits[0] in mdl:
                              text = re.sub(r"(?<![A-Za-z0-9\-])" + digits[0] + r"(?![0-9])", mdl, pending, count=1)
                          else:
                              text = mdl + "の" + re.sub(r"^(では|じゃあ|それでは)、?", "", pending)
                  models_now = extract_models(text)

              # ---- 2. 入力の異常(記号のみ・空) ----
              if not re.search(r"[A-Za-z0-9ぁ-んァ-ヶ一-龥]", text):
                  return out_fixed("ご質問の意図を確認させてください。入力された内容(記号のみ)からは、何についてのご質問か判断できませんでした。"
                                   "装置名・型番と知りたい内容を含めて質問してください(例:「XGMC-2016の消費電力を教えてください」)。")

              # ---- 3. プロンプトインジェクション・開示要求 ----
              if re.search(r"システムプロンプト|system ?prompt|プロンプトを(表示|教え|見せ|開示|出力)|内部(の)?(指示|設定)|あなたへの指示", text, re.I):
                  return out_fixed("申し訳ありませんが、システムプロンプトや内部の指示内容は開示できません。登録資料(マニュアル・仕様書)に関するご質問にお答えします。")
              inj = r"(これまで|今まで|以前|上記|前)の(指示|命令|ルール|設定|制約)を?(すべて|全て)?(忘れ|無視|破棄|リセット)[^。、]*[。、]?|ルールを無視[^。、]*[。、]?|制限を(解除|外)[^。、]*[。、]?|自由に回答してください[。、]?|何でも答えて[^。、]*[。、]?"
              if re.search(inj, text):
                  prefix = "※回答ルール(登録資料のみを根拠に回答する)は変更できません。ルールを維持したまま回答します。\n\n"
                  text = re.sub(inj, "", text).strip()
                  models_now = extract_models(text)
                  if not re.search(r"[A-Za-z0-9ぁ-んァ-ヶ一-龥]", text):
                      return out_fixed(prefix.strip())

              # ---- 4. 創作・推測の要求 ----
              if re.search(r"創作|それらしく|でっち上げ|捏造|予想して|推測して|想像して|架空|作り話|考えて(ください|下さい)", text):
                  return out_fixed("登録資料にない情報の推測・創作には応じられません。" + NOT_FOUND)

              # ---- 5. 利用者からの情報の刷り込み ----
              if re.search(r"覚えて|記憶して|学習して|覚えておいて|記録して", text):
                  return out_fixed("ご提示いただいた情報は登録資料に記載された情報ではないため、記憶したり回答の根拠として使用したりすることはできません。"
                                   "本アプリは登録資料(マニュアル・仕様書)の記載のみを根拠に回答します。")

              # ---- 6. 用途外 ----
              if re.search(r"天気|翻訳|英語に|英訳|和訳|訳して|FizzBuzz|プログラム(を|の)?(書|作)|コードを(書|作)|Python|JavaScript|Java\b|小説|歌詞|ジョーク|占い|レシピ", text, re.I) or \
                      (re.fullmatch(r"(こんにちは|こんばんは|おはよう(ございます)?|ありがとう(ございます)?|hello|hi)[。!！]*", text, re.I)):
                  return out_fixed("申し訳ありませんが、本アプリはメディアコンバーター(アプレシア製 XGMC・GMC・CGMC シリーズ、NEC製 GM3200・GM100 など)"
                                   "および光モジュールの登録資料に関するご質問専用です。雑談・天気・翻訳・プログラム作成などのご依頼は用途外のためお答えできません。")

              # ---- 7. 良否・導入可否などの判断の要求 ----
              if re.search(r"良い製品|いい製品|良い装置|良いもの|優れてい|おすすめ|オススメ|お勧め|どちらを(導入|選|買|使|採用)|導入すべき|買うべき|選ぶべき|採用すべき|どれがいい|どっちがいい|使うべき", text):
                  names = "・".join(dict.fromkeys(m["model"] for m in models_now if m["valid"]))
                  return out_fixed("製品の良し悪しや、どの製品を導入すべきかといった主観的な判断・構成判断にはお答えできません。"
                                   "登録資料に記載された客観的な仕様(消費電力・質量・対応インタフェースなど)であればお答えできますので、"
                                   + ("%sについて" % names if names else "") + "知りたい項目を指定して質問してください。",
                                   new_last=(models_now[-1]["model"] if models_now and models_now[-1]["valid"] else None))

              # ---- 8. 型番だけの入力 ----
              rest = text
              for m in models_now:
                  rest = rest.replace(m["tok"], "")
              if models_now and not re.search(r"[A-Za-z0-9ぁ-んァ-ヶ一-龥]", rest):
                  names = "・".join(m["model"] for m in models_now)
                  return out_fixed("「%s」について、何を知りたいか教えてください(例: 消費電力、質量、状態確認のコマンド、ログの確認方法など)。" % names,
                                   new_last=models_now[-1]["model"] if models_now[-1]["valid"] else None)

              # ---- 9. 日本語の誤り ----
              jp = japanese_issue(english_to_japanese(text), models_now)
              if jp:
                  reason, guess = jp
                  return out_fixed("ご質問の内容を正しく理解するため確認させてください。%s「%s」という意味でしょうか? よろしければ「はい」と入力するか、正しい内容で改めて質問してください。"
                                   % (reason, guess), new_pending=guess if "何を知りたいか" not in guess else "")

              text = english_to_japanese(text)
              models_now = extract_models(text)

              # ---- 10. 曖昧な質問(装置を特定できない) ----
              if not models_now:
                  if re.search(r"この(機器|装置|製品|モジュール)|その(機器|装置|製品|モジュール)|^(では|じゃあ|それでは)", text):
                      hint = ("直前の話題の「%s」のことでしょうか? " % last_model) if last_model else ""
                      return out_fixed("「この機器」など、どの装置を指しているかを質問文から特定できません。%s装置名(型番)を含めて改めて質問してください。" % hint,
                                       new_pending=text)
                  digits = [d for d in re.findall(r"(?<![A-Za-z0-9\-])(\d{3,4})(?![0-9])", text) if d in DIGIT_INDEX]
                  if digits:
                      cands = DIGIT_INDEX[digits[0]][:8]
                      return out_fixed("「%s」だけでは装置を特定できません。どの装置についてのご質問でしょうか? (候補: %s など)" % (digits[0], "、".join(cands)),
                                       new_pending=text)
                  if re.search(r"SFP|XFP|光モジュール", text, re.I) and re.search(r"伝送距離|距離|波長|レベル|仕様|規格", text) and not re.search(DOC_REF, text):
                      return out_fixed("どの光モジュールについてのご質問でしょうか? 型番を指定してください(例: H-LX40-SFP、H-LX80-SFP、LR-XFP など)。",
                                       new_pending=text)
                  if re.search(DEVICE_ASPECT, text, re.I) and not re.search(DOC_REF, text) and \
                          not re.search(r"(configure|show|no|write|reboot)\s+[a-z\-]+", text) and not re.search(r"SEND|XGMC|GMC|SFP", text):
                      return out_fixed("どの装置(またはモジュール)についてのご質問でしょうか? 装置名・型番を含めて質問してください"
                                       "(例: XGMC-2016、GM3200、H-LX40-SFP など)。", new_pending=text)

              # ---- 11. 質問の分割と各質問の判定 ----
              texts, style = split_parts(text)
              parts = [classify_part(p) for p in texts][:4]
              rag = [p for p in parts if p["type"] == "rag"]
              valid_models = [m["model"] for m in extract_models(text) if m["valid"]]
              new_last = valid_models[-1] if valid_models else last_model
              if not rag:
                  if len(parts) == 1:
                      return out_fixed(prefix + parts[0]["answer"], new_last=new_last)
                  body = "\n\n".join("### %d. %s\n%s" % (i + 1, p["text"], p["answer"]) for i, p in enumerate(parts))
                  return out_fixed(prefix + body, new_last=new_last)
              # 検索枠(q1〜q4)を各質問に割り当てる(1質問に複数枠もあり。空き枠は q1 と同じクエリ)
              qs = []
              for p in rag:
                  p["slots"] = []
              while len(qs) < 4 and any(p["queries"] for p in rag):
                  for p in rag:
                      if p["queries"] and len(qs) < 4:
                          p["slots"].append(len(qs))
                          qs.append(p["queries"].pop(0))
              qs += [qs[0]] * (4 - len(qs))
              plan = {"parts": parts, "style": style, "original": raw, "normalized": text}
              return {"route": "rag", "fixed_answer": prefix, "plan_json": json.dumps(plan, ensure_ascii=False),
                      "q1": qs[0], "q2": qs[1], "q3": qs[2], "q4": qs[3], "new_pending": "", "new_last_model": new_last,
                      "normalized": text}
        variables:
        - variable: query
          value_selector:
