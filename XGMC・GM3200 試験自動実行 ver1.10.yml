    - data:
        type: code
        title: 試験入力の整形
        desc: 試験項目書/簡易形式の両方に対応。手動試験は除外して末尾に記載
        code_language: python3
        code: |
          import json
          import re

          # ============================================================
          # 試験入力の整形(試験自動実行ワークフロー用コードノード)
          # 対応する入力 Excel:
          #   (A) 試験項目書(03_試験項目書_完成版 の方眼紙フォーマット: 通番/項番.試験名/試験メッセージ/想定結果)
          #   (B) 簡易形式(no / question / expect 列。expect は「|」区切りの期待キーワード、空欄可)
          # start_no(開始通番)と max_items(最大件数)で分割実行できる(ワークフローの実行時間上限対策)
          # 手動実施の項目(キャッシュ影響確認・回答生成中の操作)は自動実行から除外する
          # ============================================================


          def to_int(v, default):
              try:
                  return int(float(str(v).strip()))
              except Exception:
                  return default


          def main(text: str, start_no, max_items) -> dict:
              data = json.loads(text or "[]")
              if isinstance(data, dict):
                  for v in data.values():
                      if isinstance(v, list):
                          data = v
                          break
              rows = [r for r in data if isinstance(r, dict)]
              start = to_int(start_no, 1)
              limit = to_int(max_items, 25)
              if limit <= 0:
                  limit = 25
              limit = min(limit, 30)  # Dify のコードノードが返せる配列は最大30件(CODE_MAX_OBJECT_ARRAY_LENGTH)

              items, manual = [], []
              # ---- (A) 試験項目書フォーマット: 見出し行から列を特定 ----
              key_msg = key_exp = key_no = None
              keys = list(rows[0].keys()) if rows else []
              if "試験メッセージ" in keys:
                  key_msg = "試験メッセージ"
                  key_exp = "想定結果" if "想定結果" in keys else None
                  key_no = "通番" if "通番" in keys else None
              for r in ([] if key_msg else rows):
                  for k, v in r.items():
                      sv = str(v).strip() if v is not None else ""
                      if sv == "試験メッセージ":
                          key_msg = k
                      elif sv == "想定結果":
                          key_exp = k
                      elif sv == "通番":
                          key_no = k
                  if key_msg:
                      break
              if key_msg:
                  manual_section = False
                  for r in rows:
                      vals = [str(v).strip() for v in r.values() if v is not None and str(v).strip() not in ("", "nan", "None")]
                      msg = str(r.get(key_msg) or "").strip()
                      name = next((v for v in vals if re.match(r"^\d+(-\d+)+\.\s", v)), "")
                      head = next((v for v in vals if re.match(r"^\d+\.\s", v)), "")
                      if head and not msg:
                          manual_section = "手動" in head
                          continue
                      if not msg or msg in ("試験メッセージ", "nan"):
                          continue
                      no = str(to_int(r.get(key_no), 0)) if key_no else ""
                      if no == "0":
                          no = ""
                      exp = str(r.get(key_exp) or "").strip() if key_exp else ""
                      item = {"no": no, "name": name, "question": msg, "expect_text": exp, "expect_kw": ""}
                      if manual_section or re.search(r"回答生成中|聞き返しの後|→|\(1問目\)|質問を続けた後|順に質問した後", msg):
                          manual.append(item)
                      else:
                          items.append(item)
              else:
                  # ---- (B) 簡易形式 ----
                  for i, r in enumerate(rows, 1):
                      low = {str(k).strip().lower(): v for k, v in r.items()}
                      q = str(low.get("question") or low.get("質問") or low.get("試験メッセージ") or "").strip()
                      if not q or q.lower() in ("question", "nan"):
                          continue
                      no = str(low.get("no") or low.get("通番") or i).strip()
                      exp_kw = str(low.get("expect") or low.get("期待キーワード") or "").strip()
                      exp_text = str(low.get("想定結果") or low.get("expected") or "").strip()
                      item = {"no": no, "name": "", "question": q, "expect_text": exp_text, "expect_kw": "" if exp_kw == "nan" else exp_kw}
                      if re.search(r"回答生成中|聞き返しの後|\(1問目\)|質問を続けた後|順に質問した後", q):
                          manual.append(item)
                      else:
                          items.append(item)

              def no_num(it):
                  m = re.match(r"\d+", it["no"] or "")
                  return int(m.group(0)) if m else 0

              sel = [it for it in items if no_num(it) >= start or not it["no"]][:limit]
              last_no = sel[-1]["no"] if sel else ""
              info = "対象 %d 件(通番 %s〜%s)/ 全自動試験 %d 件 / 手動試験(自動実行対象外) %d 件" % (
                  len(sel), sel[0]["no"] if sel else "-", last_no or "-", len(items), len(manual))
              return {"items": sel, "info": info, "manual_json": json.dumps(manual, ensure_ascii=False)}
        variables:
        - variable: text
          value_selector:
          - '2002'
          - text
        - variable: start_no
          value_selector:
