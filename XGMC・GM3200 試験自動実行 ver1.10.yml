        type: code
        title: 結果集計
        desc: ''
        code_language: python3
        code: |
          import json

          # ============================================================
          # 結果集計(試験自動実行ワークフロー用コードノード)
          #   各行を Excel 出力用 JSON にまとめ、手動試験の項目も「手動」として末尾に追記する
          # ============================================================


          def main(results: list, info: str, manual_json: str) -> dict:
              rows, cnt = [], {"OK": 0, "NG": 0, "要確認": 0, "エラー": 0}
              for r in results or []:
                  try:
                      row = json.loads(r) if isinstance(r, str) else None
                  except Exception:
                      row = None
                  if not row:
                      row = {"通番": "", "試験メッセージ": "", "回答": str(r)[:500], "LLM判定": "エラー"}
                  rows.append(row)
                  cnt[row.get("LLM判定", "要確認") if row.get("LLM判定") in cnt else "要確認"] += 1
              try:
                  manual = json.loads(manual_json or "[]")
              except Exception:
                  manual = []
              for it in manual:
                  rows.append({"通番": it.get("no", ""), "項番・試験名": it.get("name", ""), "試験メッセージ": it.get("question", ""),
                               "想定結果": it.get("expect_text", ""), "回答": "", "LLM判定": "手動",
                               "判定理由": "会話の継続・生成中の操作が必要なため手動で実施してください", "キーワード判定": "-",
                               "参照の有無": "-", "回答経路": "-"})
              # Dify のコードノードの文字列出力上限(80000字)に収まるよう、回答欄を必要に応じて短くする
              size = 2000
              out = json.dumps(rows, ensure_ascii=False)
              while len(out) > 75000 and size > 200:
                  size = int(size * 0.7)
                  for row in rows:
                      for k in ("回答", "想定結果"):
                          if len(str(row.get(k, ""))) > size:
                              row[k] = str(row[k])[:size] + "…(省略)"
                  out = json.dumps(rows, ensure_ascii=False)
              stats = "%s / 実行 %d 件: OK %d 件、NG %d 件、要確認 %d 件、エラー %d 件(LLM判定は目安です。NG・要確認は回答を人が確認してください)" % (
                  info, len(results or []), cnt["OK"], cnt["NG"], cnt["要確認"], cnt["エラー"])
              return {"rows_json": out, "stats": stats}
        variables:
        - variable: results
          value_selector:
          - '2004'
          - output
        - variable: info
          value_selector:
          - '2003'
          - info
        - variable: manual_json
          value_selector:
          - '2003'
          - manual_json
        outputs:
          rows_json:
            children: null
            type: string
          stats:
            children: null
            type: string
