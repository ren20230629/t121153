    - data:
        code: "import json\nimport re\ntry:\n    import unicodedata\nexcept Exception:  # サンドボックスで利用できない場合は全角英数記号のみ半角化する\n    class unicodedata:\n        @staticmethod\n        def normalize(form, s):\n            return \"\".join(chr(ord(c) - 0xFEE0) if 0xFF01 <= ord(c) <= 0xFF5E else (\" \" if c == \"\\u3000\" else c) for c in s)\n\n# ============================================================\n# 資料整理(Dify コードノード)\n#   入力 : plan_json(前処理の結果) / r1〜r4(知識検索 1〜4 の結果)\n#   出力 : context(LLM に渡す質問別の資料) / meta_json(質問別の出典一覧。回答整形で使用)\n# 質問ごとに、型番・観点に合う検索結果だけを選び、別機種の資料や目次ページを除外する\n# ============================================================\n\nNEC_WORDS = re.compile(r\"GM3200|GM100|ME3200|ME100|GM1600|付録_GM3200\", re.I)\nAPRESIA_WORDS = re.compile(r\"XGMC|GMC-|CGMC|XGML|CGML|XGMU|XGMC2Ware|APRESIA|Apresia\", re.I)\nSRC_RE = re.compile(r\"^\\s*【出典:\\s*(.+?)\\s*(?:\\|\\s*(.+?))?\\s*】\")\nMODULE_IN_SRC = re.compile(r\"(?<![A-Z0-9])(?:H-)?[A-Z]{2,3}\\d{0,3}-(?:SFP|XFP)(?![A-Z0-9])\", re.I)\nCMDREF_RE = re.compile(r\"CommandReference|コマンドリファレンス\", re.I)\nSRC_MODEL_RE = re.compile(r\"(?:XGMC|CGMC|XGML|CGML|GMC)-?\\d{4}[A-Z]*\", re.I)\nSIGNED_RE = re.compile(r\"([-+]?\\d+(?:\\.\\d+)?)\\s*[〜~～]\\s*\\+(\\d+(?:\\.\\d+)?)\\s*(dBm|dB)\")\nTOPIC_SOURCES = [\n    (r\"交換編\", r\"交換編\"),\n    (r\"FTP編\", r\"FTP編\"),\n    (r\"SEND|ATT|アッテネーター|光出力\", r\"SEND発生時\"),\n    (r\"機器仕様一覧\", r\"機器仕様一覧\"),\n    (r\"手順書|交換編|FTP編|バージョンアップ\", r\"手順書|CTRL盤|ファームウェア\"),\n    (r\"XFP|SFP|光モジュール|トランシーバ\", r\"Transceiver_list|SP61-|仕様書|SFP|XFP\"),\n    (r\"リリース|Ver|バージョン\", r\"Release|リリース|差分\"),\n]\nCORE_TERMS = [\n    \"皮相電力\", \"消費電力\", \"質量\", \"重量\", \"寸法\", \"送信波長\", \"受信波長\", \"波長\", \"光送信レベル\", \"光受信レベル\",\n    \"伝送距離\", \"ログ\", \"状態\", \"交換\", \"制御盤\", \"CTRL\", \"盤\", \"ラインカード\", \"MIB\", \"SEND\", \"ATT\", \"アッテネーター\",\n    \"障害\", \"トラブル\", \"XFP\", \"SFP\", \"手順\", \"リリース\", \"コマンド\", \"警報転送\", \"S6\", \"S7\", \"community\", \"コミュニティ\",\n    \"ファームウェア\", \"ダウンロード\", \"Multicast\", \"tech-support\", \"diagnosis\", \"10G_PKG\", \"削除\", \"追加\",\n]\n\n\ndef nf(s):\n    return unicodedata.normalize(\"NFKC\", s or \"\")\n\n\ndef src_of(item):\n    content = item.get(\"content\", \"\") if isinstance(item, dict) else str(item)\n    m = SRC_RE.match(content)\n    if m:\n        return m.group(1).strip(), (m.group(2) or \"\").strip(), content[m.end():]\n    title = \"\"\n    if isinstance(item, dict):\n        title = item.get(\"title\") or (item.get(\"metadata\") or {}).get(\"document_name\") or \"\"\n    return title.strip() or \"(資料名不明)\", \"\", content\n\n\ndef page_label(page):\n    p = re.sub(r\"\\(続き\\d+\\)\", \"\", page or \"\").strip()\n    m = re.match(r\"(\\d+)ページ\", p)\n    if m:\n        return \"p.\" + m.group(1)\n    return p\n\n\ndef is_toc(body):\n    b = nf(body)\n    return \"本文なし\" in b or len(re.findall(r\"[・.·…‥]{8,}\", b)) >= 2 or len(re.findall(r\"\\.{4,}\\s*\\d\", b)) >= 3\n\n\ndef doc_version(src):\n    \"\"\"コマンドリファレンスの(装置, 版)を返す。同じ装置の旧版は、最新版が検索されていれば使わない\"\"\"\n    if not CMDREF_RE.search(src):\n        return None, None\n    m = SRC_MODEL_RE.search(src)\n    v = re.search(r\"Ver\\.?(\\d+)\\.(\\d+)(?:\\.(\\d+))?\", src) or re.match(r\"(\\d+)\\.(\\d+)\\.(\\d+)-\", src)\n    if not m or not v:\n        return None, None\n    return m.group(0).upper().replace(\"-\", \"\"), tuple(int(x or 0) for x in v.groups())\n\n\ndef is_module(model):\n    \"\"\"光モジュールの型番か(SFP・XFP・QSFP・CFP を含む型番)\"\"\"\n    return bool(re.search(r\"SFP|XFP|QSFP|CFP\", nf(model), re.I))\n\n\ndef is_device_doc(src):\n    \"\"\"装置(メディアコンバーター本体)の資料か。資料名に装置の型番・シリーズ名がある資料を装置の資料とみなす\"\"\"\n    return bool(NEC_WORDS.search(src) or APRESIA_WORDS.search(src) or SRC_MODEL_RE.search(src))\n\n\ndef model_variants(model):\n    m = nf(model).upper()\n    return {m, m.replace(\"-\", \"\"), m.replace(\"-\", \" \")}\n\n\ndef has_model(text, model):\n    \"\"\"型番が語として含まれるか(GMC-2001 が XGMC-2001L に、XGMC-2001L が XGMC-2001LDW に部分一致しないようにする)\"\"\"\n    t = re.sub(r\"[‐‑‒–—―−]\", \"-\", nf(text)).upper()\n    return any(re.search(r\"(?<![A-Z0-9])%s(?![A-Z0-9])\" % re.escape(v), t) for v in model_variants(model))\n\n\ndef main(plan_json: str, r1: list, r2: list, r3: list, r4: list) -> dict:\n    try:\n        plan = json.loads(plan_json or \"{}\")\n    except Exception:\n        plan = {}\n    parts = plan.get(\"parts\", [])\n    results = [r1 or [], r2 or [], r3 or [], r4 or []]\n    rag = [p for p in parts if p.get(\"type\") == \"rag\"]\n    budget = max(3000, 12000 // max(1, len(rag)))\n    blocks, meta = [], []\n    for qi, p in enumerate(rag, 1):\n        text = nf(p.get(\"text\", \"\"))\n        models = p.get(\"models\", [])\n        nec_q = any(NEC_WORDS.search(m) for m in models)\n        # 光モジュール同士の比較・前提確認の質問か(例: H-LX40-SFP と H-LX80-SFP の違い)\n        module_cmp = len(models) >= 2 and all(is_module(m) for m in models)\n        apr_q = any(APRESIA_WORDS.search(m) for m in models)\n        cands, seen = [], set()\n        for slot in p.get(\"slots\", []):\n            for rank, item in enumerate(results[slot] if slot < len(results) else []):\n                src, page, body = src_of(item)\n                key = (src, page, body[:80])\n                if key in seen or not body.strip() or is_toc(body):\n                    continue\n                seen.add(key)\n                hay = nf(src + \" \" + body).upper()\n                score = 0.0\n                hit_model = False\n                for mdl in models:\n                    if has_model(src, mdl):\n                        score += 6\n                        hit_model = True\n                    elif has_model(body, mdl):\n                        score += 3\n                        hit_model = True\n                topic = False\n                for qpat, spat in TOPIC_SOURCES:\n                    if re.search(qpat, text, re.I) and re.search(spat, src, re.I):\n                        score += 3\n                        topic = True\n                for t in CORE_TERMS:\n                    if t.upper() in text.upper() and t.upper() in hay:\n                        score += 1.5\n                for tok in re.findall(r\"[a-z][a-z0-9\\-]{3,}|\\d+\\.\\d+\\.\\d+|Ver\\.?\\s?\\d[\\d.]+\", text):\n                    if nf(tok).upper() in hay:\n                        score += 2\n                # 質問中の CLI コマンド(例: configure linecard lh-port ...)が引数を挟んでそのまま現れる資料を優先\n                for phrase in re.findall(r\"(?:[a-z][a-z0-9\\-]*\\s+){2,}[a-z][a-z0-9\\-]*\", text):\n                    words = phrase.split()\n                    pat = r\"(?:\\s+<[^>]+>)?\\s+\".join(re.escape(w) for w in words)\n                    if re.search(pat, nf(body), re.I):\n                        score += 8\n                # 別メーカー装置の資料は除外(GM3200 の質問に XGMC の資料を使わない、など)\n                if apr_q and not nec_q and NEC_WORDS.search(src) and not hit_model:\n                    continue\n                if nec_q and not apr_q and APRESIA_WORDS.search(src) and not hit_model and not topic:\n                    continue\n                # 別の光モジュールの仕様書(H-LX40-SFP の質問に H-LX80-SFP仕様書 など)は除外\n                src_mods = [x.upper() for x in MODULE_IN_SRC.findall(nf(src))]\n                if models and src_mods and not any(sm in nf(m).upper() or nf(m).upper() in sm for sm in src_mods for m in models):\n                    continue\n                if models and not hit_model and not topic:\n                    score -= 4\n                # 光モジュール同士の比較: 伝送特性の表がある資料(モジュールの仕様書)を優先する\n                if module_cmp and hit_model and not is_device_doc(src) and re.search(r\"伝送特性|主要特性|送信波長|光送信レベル\", nf(body)):\n                    score += 2\n                score -= rank * 0.3\n                cands.append((score, src, page, body))\n        latest = {}\n        for c in cands:\n            fam, ver = doc_version(c[1])\n            if fam and ver > latest.get(fam, ()):\n                latest[fam] = ver\n        cands = [c for c in cands if doc_version(c[1])[0] is None or doc_version(c[1])[1] == latest[doc_version(c[1])[0]]]\n        cands.sort(key=lambda x: -x[0])\n        if module_cmp:\n            # 装置の資料(XGMC-2016 の標準仕様書など)にも複数モジュールの値が載っているため、そのままだと装置の資料1件だけが\n            # 根拠・出典になる。すべてのモジュールについて装置以外の資料に仕様(伝送特性の表など)が検索されていれば、装置の資料は使わない\n            own = [c for c in cands if not is_device_doc(c[1])]\n            spec = [c for c in own if re.search(r\"伝送特性|主要特性|送信波長|光送信レベル\", nf(c[3]))]\n            if all(any(has_model(c[1], m) or has_model(c[3], m) for c in spec) for m in models):\n                cands = own\n        good = [c for c in cands if c[0] > -2][:4] or cands[:2]\n        if len(models) >= 2:\n            # 比較など複数型番の質問: 型番ごとに最上位の資料を必ず含める(片方の資料だけにならないように)\n            # 資料名にその型番がある資料を優先し、無ければ本文にその型番があり資料名が別の型番でない資料を選ぶ\n            must = []\n            for m in models:\n                others = [o for o in models if o != m]\n                best = next((c for c in cands if has_model(c[1], m)), None) or \\\n                    next((c for c in cands if has_model(c[3], m) and not any(has_model(c[1], o) for o in others)), None)\n                if best and best not in must:\n                    must.append(best)\n            good = (must + [c for c in good if c not in must])[:4]\n        lines = [\"## 【質問%d】%s\" % (qi, p.get(\"llm_text\") or p.get(\"text\", \"\"))]\n        if p.get(\"premise\"):\n            lines.append(\"(この質問は利用者の前提が正しいかの確認です。資料で確認できない前提は肯定せず、誤りは指摘してください)\")\n        if p.get(\"note\"):\n            lines.append(\"(補足: %s)\" % p[\"note\"])\n        if p.get(\"hint\"):\n            lines.append(\"(回答の注意: %s)\" % p[\"hint\"])\n        used, srcs = 0, []\n        for j, (sc, src, page, body) in enumerate(good, 1):\n            room = min(1500, budget - used)\n            if room < 300:\n                break\n            b = re.sub(r\"【出典:[^】]*】\", \"\", nf(body))\n            b = re.sub(r\"[ \\t　]+\", \" \", b)\n            b = re.sub(r\"\\s*\\n\\s*\", \"\\n\", b).strip()[:room]\n            used += len(b)\n            ref = (src + \" \" + page_label(page)).strip()\n            lines.append(\"### 【資料%d-%d】出典: %s\\n%s\" % (qi, j, ref, b))\n            # 資料名に型番がある資料はその型番の資料とみなす(本文で他の型番に触れていても、その型番の出典にはしない)\n            in_src = [m for m in models if has_model(src, m)]\n            srcs.append({\"src\": src, \"page\": page_label(page), \"ref\": ref, \"excerpt\": b[:1500],\n                         \"models\": in_src or [m for m in models if has_model(body, m)],\n                         \"signed\": [\"%s|%s|%s\" % g for g in SIGNED_RE.findall(nf(body))][:10]})\n        if not srcs:\n            lines.append(\"(該当する資料は検索されませんでした)\")\n        blocks.append(\"\\n\".join(lines))\n        meta.append({\"text\": p.get(\"text\", \"\"), \"models\": models, \"sources\": srcs})\n    # 元の質問は渡さない(固定回答済みの部分まで LLM が番号を振り、【回答n】がずれるため)\n    head = \"## 質問数: %d(【回答1】〜【回答%d】をこの順で出力)\" % (len(rag), len(rag))\n    style = plan.get(\"style\", \"\")\n    if style:\n        head += \"\\n(回答スタイルの指示: %s)\" % style\n    return {\"context\": head + \"\\n\\n\" + \"\\n\\n\".join(blocks), \"meta_json\": json.dumps(meta, ensure_ascii=False)}\n"
