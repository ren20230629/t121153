    - data:
        code: "import json\nimport re\n\n# ============================================================\n# 回答整形(Dify コードノード)\n#   入力 : text(LLM の出力) / plan_json / meta_json / prefix(前置きの注意書き)\n#   出力 : answer(利用者に返す最終回答)\n# ・思考タグ/英語の検討メモを除去 ・質問ごとの回答を元の順序で組み立て(固定回答の質問も合流)\n# ・参照(元ファイル名+ページ)を検証し、欠けていれば検索ヒットの出典を機械的に付与\n# ・LLM が空応答のときは検索ヒットの該当箇所を表示(空回答を返さない)\n# ============================================================\n\nNOT_FOUND = \"登録資料に記載が見つかりませんでした。原本のマニュアルを確認してください。\"\nNF_RE = re.compile(r\"記載が見つかりません|記載はありません|記載がありません|見つかりませんでした\")\n# バージョンの質問で、回答に参照(出典)を付けられない場合の回答\nNO_RELATED = \"関連記載なし(登録資料に該当する記載が見つかりませんでした。原本のマニュアル・リリースノートを確認してください。)\"\nASK_VERSION_RE = re.compile(r\"どのバージョン|どの版|何バージョン|バージョンはどれ|バージョンは何|いつ(から)?(追加|削除|廃止|変更)\")\nVERSION_Q_RE = re.compile(r\"バージョン(?!アップ)|リリース|追加された|削除|廃止|\\d+\\.\\d{2}\\.\\d{2}\")  # 「バージョンアップ手順書」は対象外\nUNSTATED_RE = re.compile(r\"(明記|記載)(は|が|も)?(見つかりません|ありません|されていません|されておりません|無い|ない)|明記なし|記載なし\")\nVALUE_RE = re.compile(r\"\\d+(?:\\.\\d+)?\\s*(?:dBm|dB|nm|W|VA|kg|mm|Gbps|Mbps|V|A|℃|ページ)|`|show |configure \")\n\n\ndef is_not_found(body):\n    \"\"\"「記載なし」だけの回答か。値やコマンドを答えたうえで「mWでの記載はありません」等と添えた回答は記載なしにしない\"\"\"\n    b = (body or \"\").strip()\n    if re.match(r\"^(登録資料に)?(該当する)?(記載|情報)(が|は)(見つかりません|ありません)\", b):\n        return True\n    return bool(NF_RE.search(b)) and len(b) < 160 and not VALUE_RE.search(b)\n\n\ndef clean(text):\n    t = re.sub(r\"<think>.*?</think>\", \"\", text or \"\", flags=re.S)\n    t = t.replace(\"<think>\", \"\").replace(\"</think>\", \"\")\n    t = re.sub(r\"^\\s*(analysis|assistant|final)\\s*:?\", \"\", t, flags=re.I)\n    # 先頭に英語の検討メモが漏れた場合は、最初の日本語/見出し行まで削る\n    if re.match(r\"\\s*(We need|We must|We should|The user|Let's|Let us|I need|I will|According to|Okay|OK,)\", t):\n        m = re.search(r\"(【回答\\d+】|^[ \\t]*[ぁ-んァ-ヶ一-龥【#*|].*$)\", t, flags=re.M)\n        t = t[m.start():] if m else \"\"\n    return t.strip()\n\n\ndef split_answers(t, n):\n    pieces = re.split(r\"(?:^|\\n)\\s*[#*]*\\s*【回答\\s*(\\d+)\\s*】[#*]*\\s*\", \"\\n\" + t)\n    found = {}\n    for i in range(1, len(pieces) - 1, 2):\n        try:\n            found[int(pieces[i])] = pieces[i + 1].strip()\n        except ValueError:\n            pass\n    if not found and n == 1 and t.strip():\n        found[1] = t.strip()\n    return found\n\n\ndef norm_ref(s):\n    return re.sub(r\"[\\s　()（）\\[\\]［］_\\-‐]\", \"\", s or \"\").lower()\n\n\ndef fix_signs(ans, sources):\n    \"\"\"資料の「0〜+5 dBm」を LLM が「0〜5 dBm」と書いた場合に、資料どおりの符号に戻す\"\"\"\n    for s in sources:\n        for sv in s.get(\"signed\", []):\n            a, b, unit = sv.split(\"|\")\n            ans = re.sub(r\"(?<![\\d.+\\-])%s\\s*[〜~～\\-–]\\s*%s\\s*%s\" % (re.escape(a), re.escape(b), unit),\n                         \"%s〜+%s %s\" % (a, b, unit), ans)\n    return ans\n\n\ndef fix_refs(ans, sources, models=None):\n    \"\"\"参照行を検証して整える。資料にない出典は除き、無ければ上位の出典を付与する。\n    複数の型番を扱う質問(比較など)は、型番ごとに少なくとも1つの出典を付ける\"\"\"\n    body_lines, cited = [], []\n    for line in ans.splitlines():\n        stripped = line.strip()\n        m = re.match(r\"^[*>\\-\\s]*(参照|出典|参考)\\s*[:：]\\s*(.*)$\", stripped)\n        if m:\n            cited += [x.strip() for x in re.split(r\"[、,／/]|\\s{2,}\", m.group(2)) if x.strip()]\n            continue\n        for mm in re.finditer(r\"【出典:\\s*([^|】]+?)\\s*(?:\\|\\s*([^】]+))?】\", line):\n            cited.append((mm.group(1) + \" \" + (mm.group(2) or \"\")).strip())\n        line = re.sub(r\"【出典:[^】]*】\", \"\", line)\n        body_lines.append(line)\n    body = \"\\n\".join(body_lines).strip()\n    if not body or is_not_found(body):\n        return body if body else NOT_FOUND\n    valid = []\n    # 同じ資料が複数ページあるときは、ページ(シート)が分かるものを優先して照合する\n    ordered = sorted(sources, key=lambda s: 0 if s.get(\"page\") else 1)\n    for c in cited:\n        cn = norm_ref(re.sub(r\"p\\.?\\s*\\d+|\\d+ページ.*\", \"\", c))\n        for s in ordered:\n            if cn and (cn in norm_ref(s[\"src\"]) or norm_ref(s[\"src\"]) in cn):\n                ref = s[\"ref\"]\n                pm = re.search(r\"p\\.?\\s*(\\d+)|(\\d+)ページ\", c)\n                if pm:\n                    ref = \"%s p.%s\" % (s[\"src\"], pm.group(1) or pm.group(2))\n                if ref not in valid:\n                    valid.append(ref)\n                break\n    # Excel 資料の参照にシート名が無いときは、同じ資料のシート名付きの検索結果から補う\n    for i, v in enumerate(valid):\n        if re.search(r\"\\.xlsx?$\", v, re.I):\n            alt = next((s[\"ref\"] for s in sources if s.get(\"page\") and v == s[\"src\"]), None)\n            if alt:\n                valid[i] = alt\n    valid = list(dict.fromkeys(valid))\n    if not valid and sources:\n        valid = [sources[0][\"ref\"]]\n    hbody = re.sub(r\"[‐‑‒–—―−]\", \"-\", body)  # LLM が型番・資料名に使う全角/特殊ハイフンを揃えて照合する\n    # 本文で資料名を挙げているのに参照に無い場合は、その資料の出典も付ける\n    for s in ordered:\n        stem = re.sub(r\"\\.(pdf|xlsx?|docx?|txt|md)$\", \"\", s[\"src\"], flags=re.I)\n        if len(stem) >= 6 and norm_ref(stem) in norm_ref(hbody) and not any(v.startswith(s[\"src\"]) for v in valid):\n            valid.append(s[\"ref\"])\n    # 本文に「資料名 の Nページ」とあるのに参照のページが違う場合は、本文のページに合わせる\n    for i, v in enumerate(valid):\n        m = re.match(r\"(.+?) p\\.(\\d+)$\", v)\n        if not m:\n            continue\n        stem = re.sub(r\"\\.(pdf|xlsx?)$\", \"\", m.group(1), flags=re.I)\n        pages = re.findall(r\"%s[^\\n]{0,20}?(?:の\\s*)?(?:(\\d+)\\s*ページ|p\\.\\s*(\\d+))\" % re.escape(stem).replace(\"\\\\-\", \"[-‐‑]\"), hbody)\n        pg = [a or b for a, b in pages]\n        if pg and m.group(2) not in pg:\n            valid[i] = \"%s p.%s\" % (m.group(1), pg[0])\n    valid = list(dict.fromkeys(valid))\n    if models and len(models) >= 2:\n        for m in models:\n            covered = any(m in s.get(\"models\", []) for s in sources for v in valid if v.startswith(s[\"src\"]))\n            extra = next((s[\"ref\"] for s in sources if m in s.get(\"models\", [])), None)\n            if not covered and extra and extra not in valid:\n                valid.append(extra)\n    if valid:\n        body += \"\\n\\n参照: \" + \" ／ \".join(valid)\n    return body\n\n\ndef fallback(sources):\n    if not sources:\n        return NOT_FOUND\n    s = sources[0]\n    return (\"(回答の自動生成に失敗したため、検索で見つかった該当箇所をそのまま表示します。内容は原本でご確認ください)\\n> \"\n            + s[\"excerpt\"].replace(\"\\n\", \"\\n> \") + \"\\n\\n参照: \" + s[\"ref\"])\n\n\ndef main(text: str, plan_json: str, meta_json: str, prefix: str) -> dict:\n    try:\n        plan = json.loads(plan_json or \"{}\")\n        meta = json.loads(meta_json or \"[]\")\n    except Exception:\n        plan, meta = {}, []\n    parts = plan.get(\"parts\", [])\n    rag_count = len([p for p in parts if p.get(\"type\") == \"rag\"])\n    answers = split_answers(clean(text), rag_count)\n    # LLM が固定回答の質問も含めて元の質問の番号で【回答n】を振った場合は、元の番号で対応付ける\n    if answers and max(answers) > rag_count and max(answers) <= len(parts):\n        answers = {sum(1 for q in parts[:i + 1] if q.get(\"type\") == \"rag\"): answers.get(i + 1, \"\")\n                   for i, q in enumerate(parts) if q.get(\"type\") == \"rag\"}\n    out, ri = [], 0\n    for p in parts:\n        if p.get(\"type\") == \"rag\":\n            ri += 1\n            srcs = meta[ri - 1][\"sources\"] if ri - 1 < len(meta) else []\n            a = answers.get(ri, \"\").strip()\n            a = fix_refs(fix_signs(a, srcs), srcs, p.get(\"models\")) if a else fallback(srcs)\n            vers = re.findall(r\"(\\d+\\.\\d{2}\\.\\d{2})\", p.get(\"text\", \"\"))\n            if len(vers) >= 2 and \"\\n参照: \" in a:\n                have = a.split(\"\\n参照: \")[-1]\n                add = [next((s[\"ref\"] for s in srcs if \"Ver.%s\" % v in s[\"src\"]), \"\") for v in vers]\n                add = [x for x in add if x and x.split(\" p.\")[0] not in have]\n                if add:\n                    a += \" ／ \" + \" ／ \".join(add)\n            if p.get(\"version\") and VERSION_Q_RE.search(p.get(\"text\", \"\")):\n                # バージョン(差分・追加・削除)の質問: 参照を付けられない回答は「関連記載なし」とする。\n                # 「どのバージョンで追加されたか」を問う質問は、資料に明記が無い旨の回答(関連しそうな記載の紹介を含む)も同じ扱いにする\n                body_only = a.split(\"\\n\\n参照: \")[0]\n                unstated = bool(ASK_VERSION_RE.search(p.get(\"text\", \"\"))) and bool(UNSTATED_RE.search(body_only))\n                if \"参照: \" not in a or unstated:\n                    a = NO_RELATED\n            if p.get(\"note\"):\n                a = p[\"note\"] + \"\\n\" + a\n            if p.get(\"tail\"):\n                a += \"\\n\\n\" + p[\"tail\"]\n        else:\n            a = p.get(\"answer\", NOT_FOUND)\n        out.append((p.get(\"text\", \"\"), a))\n    if len(out) == 1:\n        final = out[0][1]\n    else:\n        final = \"\\n\\n\".join(\"### %d. %s\\n%s\" % (i + 1, q, a) for i, (q, a) in enumerate(out))\n    return {\"answer\": ((prefix or \"\") + final).strip()}\n"
